<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotogram</title>

    <link rel="stylesheet" href="./assets/styles/style.css">
    <link rel="stylesheet" href="./assets/styles/fonts.css">
    <script src="script.js"></script>
</head>

<body onload="initGalleryFunctions()">

    <header>
        <img src="./assets/icons/fotogram-logo.svg" alt="Fotogram Logo">
    </header>

    <main>
        <h1>Dein persönliches Fotoalbum</h1>

        <section class="gallery" id="gallery">
        </section>

    </main>

    <dialog id="gallery-dialog" class="gallery-dialog" onclick="closeDialogOnBackdrop(event)">
        <div class="dialog-content">
            <div class="dialog-header">
                <h2 id="dialog-title"></h2>
                <button class="dialog-close" onclick="closeDialog()" aria-label="Schließen">
                    <img src="./assets/icons/close.svg" alt="">
                </button>
            </div>

            <img id="dialog-img" class="dialog-image" src="" alt="Großansicht des Bildes">

            <div class="dialog-nav">
                <button class="dialog-arrow" onclick="showPreviousPicture()" aria-label="Vorheriges Bild">
                    <img src="./assets/icons/button-left.svg" alt="">
                </button>
                <span id="dialog-counter"></span>
                <button class="dialog-arrow" onclick="showNextPicture()" aria-label="Nächstes Bild">
                    <img src="./assets/icons/button-right.svg" alt="">
                </button>
            </div>
        </div>
    </dialog>

    <footer>
        <img src="./assets/icons/footer-logo.svg" alt="Developer Akedemie Logo">
        <p>© 2026 Marven Janssen</p>
    </footer>

</body>

</html>
